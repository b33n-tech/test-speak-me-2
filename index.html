<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaQuick</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.svg">

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #fff;
      color: #000;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #banner {
      text-align: center;
      font-size: 28px;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      min-height: 60px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 10px;
    }

    button {
      font-size: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #f2f2f2;
    }

    .double {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    .split {
      display: none;
      flex: 1;
    }

    .half {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      padding: 20px;
    }

    .top {
      transform: rotate(180deg);
      border-bottom: 1px solid #ddd;
    }

    .settings {
      display: none;
      padding: 10px;
      border-top: 1px solid #ddd;
    }

    select, input {
      font-size: 16px;
      margin: 5px 0;
      width: 100%;
    }
  </style>
</head>
<body>

<header>
  <strong>LinguaQuick</strong>
  <div>
    <button onclick="toggleSplit()">↕</button>
    <button onclick="toggleSettings()">⚙</button>
  </div>
</header>

<div id="banner"></div>

<main id="main">
  <div class="grid" id="grid"></div>

  <div class="split" id="split">
    <div class="half top" id="topText"></div>
    <div class="half" id="bottomText"></div>
  </div>
</main>

<div class="settings" id="settings">
  <label>Langue Natale</label>
  <select id="nativeLang"></select>

  <label>Langue Cible</label>
  <select id="targetLang"></select>

  <label>
    <input type="checkbox" id="phonetic"> Phonétique (AR/FA)
  </label>

  <label>Taille texte</label>
  <input type="range" id="fontSize" min="16" max="40" value="28">
</div>

<script src="app.js"></script>
</body>
</html>
